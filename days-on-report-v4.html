function fmt(n){ if(n===null||n===undefined) return "-"; if(typeof n==="string") return n; return Math.round(n).toLocaleString('ko-KR'); }
function pct(n, digits=1){ if(n===null||n===undefined) return "-"; return (n>0?"+":"") + n.toFixed(digits) + "%"; }
function deltaClass(n){ if(n===null||n===undefined) return "flat"; return n>0?"up":(n<0?"down":"flat"); }

function periodLabel(){ return document.getElementById('periodSelect').selectedOptions[0].text; }

function getValue(c, idx){
  if(currentPeriod === "month") return c.month ? c.month.aug[idx] : null;
  return (c.weeks && c.weeks[currentPeriod]) ? c.weeks[currentPeriod][idx] : null;
}

function barChart(rows, unit){
  const max = Math.max(...rows.map(r=>r.v||0), 1);
  return `<div class="chart-wrap">${rows.map(r=>`
    <div class="bar-row">
      <div class="bl">${r.label}</div>
      <div class="bt"><div class="bf" style="width:${Math.max((r.v/max*100),2)}%"></div></div>
      <div class="bv">${fmt(r.v)}${unit}</div>
    </div>`).join('')}</div>`;
}

  return `
  <div class="panel">
    <h2>전체 채널 통합 요약 (월별 기준) · 8월 vs 7월</h2>
    <p class="desc">메타(협력광고·외부링크) · 구글 · 네이버(SA·GFA) 합산 (애드부스트 별도)</p>
    <div class="grid2">
      <div class="card"><div class="label">총 광고비</div><div class="value">${fmt(totalCostAug)}원</div><div class="delta ${deltaClass(costDelta)}">${pct(costDelta)} (전월비)</div></div>
      <div class="card"><div class="label">총 구매전환매출</div><div class="value">${fmt(totalRevAug)}원</div><div class="delta ${deltaClass(revDelta)}">${pct(revDelta)} (전월비)</div></div>
    </div>
  </div>
  <div class="panel">
    <h2>채널별 광고비 비교 · ${periodLabel()}</h2>
    <p class="desc">기간 드롭다운을 바꾸면 아래 막대그래프도 함께 바뀝니다.</p>
    ${barChart(costRows, "원")}
  </div>
  <div class="panel">
    <h2>채널별 ROAS 비교 · ${periodLabel()}</h2>
    ${barChart(roasRows, "%")}
  </div>
  <div class="panel">
    <h2>채널별 성과 한눈에 보기</h2>
    <p class="desc">카드를 클릭하면 왼쪽 매체 메뉴로 이동합니다.</p>
    <div class="grid2">${cards}</div>
  </div>`;
}

function channelTableHTML(key){
  const c = CH[key];
  if(!c.month){
    return `<div class="panel"><h2>${c.name}</h2>
      <p class="desc">8월 4주차부터 상품·캠페인 세분화 운영을 시작하여 월별/주차별 비교표는 별도 산출되지 않았습니다.</p>
      <div class="note">${c.note}</div></div>`;
  }
  const isWeek = currentPeriod !== "month";
  let rowsHtml, barRows;
  if(!isWeek){
    rowsHtml = c.cols.map((label,i)=>{
      const jul=c.month.jul[i], aug=c.month.aug[i], wow=c.month.wow[i];
      const isPct = i===5;
      return `<tr><td>${label}</td><td class="num">${isPct?jul+'%':fmt(jul)}</td><td class="num">${isPct?aug+'%':fmt(aug)}</td><td class="delta ${isPct?'':deltaClass(wow)}">${isPct?'-':pct(wow,2)}</td></tr>`;
    }).join('');
    barRows = c.cols.map((label,i)=> i<5 ? {label, v:c.month.aug[i]} : null).filter(Boolean);
  } else {
    const wdata = c.weeks ? c.weeks[currentPeriod] : null;
    if(!wdata){
      rowsHtml = `<tr><td colspan="4" style="color:var(--muted)">해당 주차 데이터가 부족하거나 집계되지 않았습니다.</td></tr>`;
      barRows = [];
    } else {
      rowsHtml = c.cols.map((label,i)=>{
        const isPct = i===5;
        return `<tr><td>${label}</td><td class="num" colspan="3" style="text-align:right">${isPct? (wdata[i]!==null?wdata[i]+'%':'-') : fmt(wdata[i])}</td></tr>`;
      }).join('');
      barRows = c.cols.map((label,i)=> i<5 ? {label, v:wdata[i]||0} : null).filter(Boolean);
    }
  }
  return `<div class="panel">
    <h2>${c.name} · ${isWeek ? periodLabel() : '월별 비교 (7월 vs 8월)'}</h2>
    <p class="desc">${isWeek ? '선택한 주차 실적' : '7월 대비 8월 성과 (구매전환 기준)'}</p>
    <div class="table-wrap"><table>
      <thead><tr><th>지표</th><th>${isWeek?periodLabel():'7월'}</th>${isWeek?'':'<th>8월</th><th>증감(WOW)</th>'}</tr></thead>
      <tbody>${rowsHtml}</tbody>
    </table></div>
  </div>
  <div class="panel">
    <h2>${c.name} · 지표 비교 그래프 (${isWeek?periodLabel():'8월'})</h2>
    ${barRows.length ? barChart(barRows,"") : '<p class="desc">표시할 데이터가 없습니다.</p>'}
  </div>`;
}

function creativeCards(list, badgeClass, badgeLabel){
  return list.map((c,i)=>`
    <div class="creative-card">
      <div class="rank">#${i+1}</div>
      <img src="${c.img}" alt="${c.name}" loading="lazy" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'noimg',textContent:'이미지 로드 실패'}))">
      <div class="info"><div class="cname">${c.name}</div></div>
    </div>`).join('');
}

function top5HTML(){
  const rows = TOP5_META_PARTNER.map((c,i)=>`<tr><td>${i+1}</td><td>${c.name}</td><td class="num">${fmt(c.impr)}</td><td class="num">${fmt(c.clicks)}</td><td class="num">${fmt(c.cost)}원</td><td class="num">${c.purchase}건</td><td class="num">${fmt(c.revenue)}원</td><td class="num">${c.roas}</td></tr>`).join('');
  return `
  <div class="panel">
    <h2>소재 성과 TOP5 · META 협력광고 (구매전환매출 기준, 8월)</h2>
    <p class="desc">구글 시트 "소재별 비교" 표 기준 · 구매전환매출이 가장 높았던 소재 5개 (이 순위의 원본 소재는 6~7월 집행분이라 계정에서 보관 만료되어 이미지 재조회는 불가)</p>
    <div class="table-wrap"><table>
      <thead><tr><th>순위</th><th>소재명</th><th>노출</th><th>클릭</th><th>지출금액</th><th>구매</th><th>구매전환매출</th><th>ROAS</th></tr></thead>
      <tbody>${rows}</tbody>
    </table></div>
  </div>
  <div class="panel">
    <h2>META 협력광고 계정 소재 (공유 구매 성과) <span class="acct-badge a1">841547815503451</span></h2>
    <p class="desc">Meta Ads MCP로 실시간 조회한 실제 소재 · 협력광고는 파트너 페이지 공동 노출 기반으로, 아래 소재들의 "구매" 실적은 <b>공유 항목이 포함된 구매(Shared Purchase)</b> 기준으로 집계됩니다.</p>
    <div class="top5-grid">${creativeCards(CREATIVES_841547815503451)}</div>
    <div class="note">📌 공유 구매란: 파트너(예: 올리브영 등)와 공동 노출되는 협력광고 특성상, 전환 기여가 데이즈온과 파트너 페이지 사이에 공유되는 구조입니다. 이 계정의 구매·매출 지표는 이 "공유 귀속" 기준값이며, 위 소재별 비교 TOP5 표의 구매/구매전환값도 동일 기준입니다.</div>
  </div>
  <div class="panel">
    <h2>META 외부링크 계정 소재 <span class="acct-badge a2">791581078215593</span></h2>
    <p class="desc">Meta Ads MCP로 실시간 조회한 실제 소재 (자사몰 오픈 이벤트 캠페인 중심)</p>
    <div class="top5-grid">${creativeCards(CREATIVES_791581078215593)}</div>
  </div>`;
}

const TABS = [
  {key:"overview", label:"표지 · 요약", group:"메인"},
  {key:"meta_partner", label:"META 협력광고", group:"매체별 리포트"},
  {key:"meta_external", label:"META 외부링크", group:"매체별 리포트"},
  {key:"google", label:"구글", group:"매체별 리포트"},
  {key:"naver_sa", label:"네이버 SA", group:"매체별 리포트"},
  {key:"naver_gfa", label:"네이버 GFA", group:"매체별 리포트"},
  {key:"adboost", label:"애드부스트", group:"매체별 리포트"},
  {key:"top5", label:"소재 성과 TOP5", group:"소재 분석"},
];

function render(){
  const nav = document.getElementById('sidenav');
  let html=''; let lastGroup=null;
  TABS.forEach(t=>{ if(t.group!==lastGroup){ html += `<div class="group-label">${t.group}</div>`; lastGroup=t.group; } html += `<button data-key="${t.key}" onclick="showTab('${t.key}')"><span class="dot"></span>${t.label}</button>`; });
  nav.innerHTML = html;
  renderApp();
}

function renderApp(){
  const app = document.getElementById('app');
  let content = `<section class="tab active" id="tab-overview">${overviewHTML()}</section>`;
  TABS.filter(t=>t.key!=="overview" && t.key!=="top5").forEach(t=>{
    content += `<section class="tab" id="tab-${t.key}">${channelTableHTML(t.key)}</section>`;
  });
  content += `<section class="tab" id="tab-top5">${top5HTML()}</section>`;
  content += `<footer>DAYS ON 통합 광고 성과 대시보드 · 데이터 출처: 광고주 제공 통합 리포트 시트(메타/네이버/구글) 및 Meta Ads MCP 실시간 조회(계정 841547815503451, 791581078215593) · 소재 썸네일은 Meta CDN 실시간 링크로, 발급 후 며칠이 지나면 만료되어 깨질 수 있습니다.</footer>`;
  const activeKey = document.querySelector('#sidenav button.active')?.dataset.key || 'overview';
  app.innerHTML = content;
  showTab(activeKey);
}

function showTab(key){
  document.querySelectorAll('section.tab').forEach(s=>s.classList.remove('active'));
  document.getElementById('tab-'+key).classList.add('active');
  document.querySelectorAll('#sidenav button').forEach(b=>b.classList.toggle('active', b.dataset.key===key));
  const t = TABS.find(t=>t.key===key);
  document.getElementById('pageTitle').textContent = t.label;
  window.scrollTo({top:0, behavior:'smooth'});
}

function onPeriodChange(){
  currentPeriod = document.getElementById('periodSelect').value;
  renderApp();
}

render();
</script>
</body>
