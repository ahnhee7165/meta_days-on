let currentPeriod = "month";
const COLLETTERS = ["A","B","C","D","E","F","G","H"];

function fmt(n){ if(n===null||n===undefined) return "-"; if(typeof n==="string") return n; return Math.round(n).toLocaleString('ko-KR'); }
function pct(n){ if(n===null||n===undefined) return "-"; return (n>0?"▲":n<0?"▼":"") + Math.abs(n).toFixed(2) + "%"; }
function deltaCls(n){ if(n===null||n===undefined) return ""; return n>0?"up":(n<0?"down":""); }

function colHeaderRow(n){
  let cells = `<th class="rownum"></th>`;
  for(let i=0;i<n;i++) cells += `<th class="colhead">${COLLETTERS[i]||i}</th>`;
  return `<tr>${cells}</tr>`;
}

function overviewHTML(){
  let totalCostJul=0, totalCostAug=0, totalRevJul=0, totalRevAug=0;
  Object.values(CH).forEach(c=>{ if(c.month){ totalCostJul+=c.month.jul[2]; totalRevJul+=c.month.jul[4]; totalCostAug+=c.month.aug[2]; totalRevAug+=c.month.aug[4]; } });
  const costDelta = ((totalCostAug-totalCostJul)/totalCostJul*100);
  const revDelta = ((totalRevAug-totalRevJul)/totalRevJul*100);

  let rowNum = 3;
  let rows = `${colHeaderRow(6)}`;
  rows += `<tr class="section-row"><td colspan="7">▶ 전체 채널 통합 요약 · 8월 vs 7월</td></tr>`;
  rows += `<tr class="header-row"><th class="rownum">${rowNum++}</th><td>구분</td><td class="num">7월</td><td class="num">8월</td><td class="num">증감(WOW)</td><td></td><td></td><td></td></tr>`;
  rows += `<tr><th class="rownum">${rowNum++}</th><td class="label-cell">총 광고비</td><td class="num">${fmt(totalCostJul)}원</td><td class="num">${fmt(totalCostAug)}원</td><td class="num ${deltaCls(costDelta)}">${pct(costDelta)}</td><td></td><td></td><td></td></tr>`;
  rows += `<tr><th class="rownum">${rowNum++}</th><td class="label-cell">총 구매전환매출</td><td class="num">${fmt(totalRevJul)}원</td><td class="num">${fmt(totalRevAug)}원</td><td class="num ${deltaCls(revDelta)}">${pct(revDelta)}</td><td></td><td></td><td></td></tr>`;
  rows += `<tr><td colspan="7" class="empty"></td></tr>`;
  rows += `<tr class="section-row"><td colspan="7">▶ 채널별 8월 ROAS 요약</td></tr>`;
  rows += `<tr class="header-row"><th class="rownum">${rowNum++}</th><td>채널</td><td class="num">8월 광고비</td><td class="num">8월 구매전환매출</td><td class="num">8월 ROAS</td><td></td><td></td><td></td></tr>`;
  Object.entries(CH).forEach(([key,c])=>{
    const roas = c.month ? c.month.aug[5] : "-";
    const cost = c.month ? fmt(c.month.aug[2])+"원" : "-";
    const rev = c.month ? fmt(c.month.aug[4])+"원" : "-";
    rows += `<tr onclick="showTab('${key}')" style="cursor:pointer"><th class="rownum">${rowNum++}</th><td class="label-cell">${c.name}</td><td class="num">${cost}</td><td class="num">${rev}</td><td class="num" style="font-weight:700;color:var(--green)">${roas}</td><td></td><td></td><td></td></tr>`;
  });
  return `<div class="gridwrap"><table class="sheet">${rows}</table></div>`;
}

    return `<div class="gridwrap"><table class="sheet">${colHeaderRow(6)}
      <tr class="section-row"><td colspan="7">▶ ${c.name}</td></tr>
      <tr><td colspan="7" class="label-cell" style="white-space:normal">${c.note}</td></tr>
      </table></div>`;
  }
  const isWeek = currentPeriod !== "month";
  let rowNum = 3;
  let rows = colHeaderRow(6);
  rows += `<tr class="section-row"><td colspan="7">▶ ${c.name} ${isWeek ? "· "+document.getElementById('periodSelect').selectedOptions[0].text : "· 월별 비교 (7월 vs 8월)"}</td></tr>`;

  if(!isWeek){
    rows += `<tr class="header-row"><th class="rownum">${rowNum++}</th><td>지표</td><td class="num">7월</td><td class="num">8월</td><td class="num">증감(WOW)</td><td></td><td></td><td></td></tr>`;
    c.cols.forEach((label,i)=>{
      const jul = c.month.jul[i], aug = c.month.aug[i], wow = c.month.wow[i];
      const isPctCol = i===5;
      rows += `<tr><th class="rownum">${rowNum++}</th><td class="label-cell">${label}</td><td class="num">${fmt(jul)}</td><td class="num">${fmt(aug)}</td><td class="num ${isPctCol?'':deltaCls(wow)}">${isPctCol?'-':pct(wow)}</td><td></td><td></td><td></td></tr>`;
    });
  } else {
    const wdata = c.weeks ? c.weeks[currentPeriod] : null;
    if(!wdata){
      rows += `<tr><td colspan="7" class="label-cell">해당 주차 데이터가 부족하거나 집계되지 않았습니다.</td></tr>`;
    } else {
      rows += `<tr class="header-row"><th class="rownum">${rowNum++}</th><td>지표</td><td class="num">${document.getElementById('periodSelect').selectedOptions[0].text}</td><td></td><td></td><td></td><td></td><td></td></tr>`;
      c.cols.forEach((label,i)=>{
        rows += `<tr><th class="rownum">${rowNum++}</th><td class="label-cell">${label}</td><td class="num hl">${fmt(wdata[i])}</td><td></td><td></td><td></td><td></td><td></td></tr>`;
      });
    }
  }
  return `<div class="gridwrap"><table class="sheet">${rows}</table></div>`;
}

function top5HTML(){
  let rowNum = 3;
  let rows = colHeaderRow(8);
  rows += `<tr class="section-row"><td colspan="9">★ 소재 성과 TOP5 · META 협력광고 (구매전환매출 기준, 8월)</td></tr>`;
  rows += `<tr class="header-row"><th class="rownum">${rowNum++}</th><td>순위</td><td>소재명</td><td class="num">노출</td><td class="num">클릭</td><td class="num">지출금액</td><td class="num">구매</td><td class="num">구매전환매출</td><td class="num">ROAS</td></tr>`;
  TOP5_META_PARTNER.forEach((c,i)=>{
    rows += `<tr><th class="rownum">${rowNum++}</th><td>${i+1}</td><td class="label-cell">${c.name}</td><td class="num">${fmt(c.impr)}</td><td class="num">${fmt(c.clicks)}</td><td class="num">${fmt(c.cost)}원</td><td class="num">${c.purchase}건</td><td class="num">${fmt(c.revenue)}원</td><td class="num" style="font-weight:700;color:var(--green)">${c.roas}</td></tr>`;
  });
  const table = `<div class="gridwrap"><table class="sheet">${rows}</table></div>`;
  const note = `<div class="note-box">⚠️ 위 TOP5 소재(260325, 260630 등)는 6~7월에 집행되어 현재 계정에서 보관 만료(비활성)되어 Meta MCP로 이미지를 다시 불러올 수 없었습니다. 아래는 같은 META 광고 계정에서 <b>현재 실제로 운영 중인 소재</b>를 MCP로 직접 가져온 것입니다.</div>`;
  const cards = LIVE_CREATIVES.map((c,i)=>`
    <div class="creative-card">
      <div class="rank">#${i+1}</div>
      <img src="${c.img}" alt="${c.name}" loading="lazy" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'noimg',textContent:'이미지 로드 실패'}))">
      <div class="info"><div class="cname">${c.name}</div></div>
    </div>`).join('');
  return table + note + `<div class="top5-grid">${cards}</div>`;
}

const TABS = [
  {key:"overview", label:"0 표지·요약"},
  {key:"meta_partner", label:"1 META 협력광고"},
  {key:"meta_external", label:"2 META 외부링크"},
  {key:"google", label:"3 구글"},
  {key:"naver_sa", label:"4 네이버 SA"},
  {key:"naver_gfa", label:"5 네이버 GFA"},
  {key:"adboost", label:"6 애드부스트"},
  {key:"top5", label:"★소재TOP5"},
];

function render(){
  const tabsEl = document.getElementById('sheettabs');
  tabsEl.innerHTML = TABS.map(t=>`<button data-key="${t.key}" onclick="showTab('${t.key}')">${t.label}</button>`).join('') + `<span class="plus">＋</span>`;

  const app = document.getElementById('app');
  let content = `<section class="tab active" id="tab-overview">${overviewHTML()}</section>`;
  TABS.filter(t=>t.key!=="overview" && t.key!=="top5").forEach(t=>{
    content += `<section class="tab" id="tab-${t.key}">${channelHTML(t.key)}</section>`;
  });
  content += `<section class="tab" id="tab-top5">${top5HTML()}</section>`;
  app.innerHTML = content;
  showTab('overview');
}

function showTab(key){
  document.querySelectorAll('section.tab').forEach(s=>s.classList.remove('active'));
  document.getElementById('tab-'+key).classList.add('active');
  document.querySelectorAll('#sheettabs button').forEach(b=>b.classList.toggle('active', b.dataset.key===key));
  document.getElementById('channelSelect').value = key;
  const t = TABS.find(t=>t.key===key);
  document.getElementById('cellref').textContent = "A1";
  document.getElementById('fxcontent').textContent = t.label;
}

function onPeriodChange(){
  currentPeriod = document.getElementById('periodSelect').value;
  TABS.filter(t=>t.key!=="overview" && t.key!=="top5").forEach(t=>{
    document.getElementById('tab-'+t.key).innerHTML = channelHTML(t.key);
  });
}

render();
</script>
</body>
</html>
