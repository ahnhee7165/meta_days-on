<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DAYS ON 통합 광고 성과 대시보드</title>
<style>
:root{
  --bg:#f5f6fa; --panel:#ffffff; --text:#171923; --muted:#6b7280;
  --border:#e5e7eb; --accent:#4f46e5; --accent2:#06b6d4; --up:#dc2626; --down:#2563eb;
  --sidebar-w:216px; --shadow:0 1px 3px rgba(0,0,0,.05), 0 6px 18px rgba(0,0,0,.04);
}
*{box-sizing:border-box;}
body{margin:0; font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Apple SD Gothic Neo","Segoe UI",sans-serif; background:var(--bg); color:var(--text); display:flex; min-height:100vh;}
aside{width:var(--sidebar-w); flex-shrink:0; background:var(--panel); border-right:1px solid var(--border); padding:22px 0; position:sticky; top:0; height:100vh; overflow-y:auto;}
.logo{padding:0 20px 16px; border-bottom:1px solid var(--border); margin-bottom:10px;}
.logo .brand{font-weight:800; font-size:17px;}
.logo .period{font-size:11px; color:var(--muted); margin-top:4px;}
nav .group-label{font-size:10.5px; color:var(--muted); font-weight:700; padding:14px 20px 6px; text-transform:uppercase; letter-spacing:.04em;}
nav button{display:flex; align-items:center; gap:9px; width:100%; text-align:left; border:none; background:none; padding:10px 20px; font-size:13.5px; cursor:pointer; color:var(--text); border-left:3px solid transparent;}
nav button:hover{background:var(--bg);}
nav button.active{background:#eef0ff; border-left-color:var(--accent); color:var(--accent); font-weight:700;}
nav button .dot{width:7px; height:7px; border-radius:50%; background:var(--border); flex-shrink:0;}
nav button.active .dot{background:var(--accent);}
main{flex:1; min-width:0; padding:24px 30px 60px;}
.topbar{display:flex; justify-content:space-between; align-items:center; margin-bottom:18px; gap:12px; flex-wrap:wrap;}
h1{font-size:21px; margin:0 0 3px;}
.sub{color:var(--muted); font-size:12.5px; margin:0;}
.periodbox{display:flex; align-items:center; gap:8px; background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:6px 10px; box-shadow:var(--shadow); flex-wrap:wrap;}
.periodbox label{font-size:12px; color:var(--muted); font-weight:600;}
.periodbox select{border:none; background:transparent; font-size:13px; font-weight:600; color:var(--accent); cursor:pointer; padding:4px 2px;}
.panel{background:var(--panel); border:1px solid var(--border); border-radius:14px; padding:20px 22px; margin-bottom:16px; box-shadow:var(--shadow);}
.panel h2{margin:0 0 3px; font-size:16px;}
.panel .desc{color:var(--muted); font-size:12px; margin:0 0 14px;}
.grid2{display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:12px;}
.grid3{display:grid; grid-template-columns:2fr 1fr; gap:16px;}
@media(max-width:900px){.grid3{grid-template-columns:1fr;}}
.card{background:var(--bg); border:1px solid var(--border); border-radius:12px; padding:14px 16px;}
.card .label{font-size:11.5px; color:var(--muted); margin-bottom:6px;}
.card .value{font-size:19px; font-weight:700;}
.card .delta{font-size:11.5px; margin-top:5px; font-weight:600; color:var(--muted);}
.delta.up{color:var(--up);} .delta.down{color:var(--down);} .delta.flat{color:var(--muted);}
table{width:100%; border-collapse:collapse; font-size:12.5px;}
th,td{padding:8px 8px; text-align:right; border-bottom:1px solid var(--border); white-space:nowrap;}
th:first-child,td:first-child{text-align:left;}
th{color:var(--muted); font-weight:600; font-size:11px;}
.table-wrap{overflow-x:auto;}
section.tab{display:none;} section.tab.active{display:block;}
.chart-wrap{margin-top:4px;}
.bar-row{display:flex; align-items:center; gap:10px; margin-bottom:9px;}
.bar-row .bl{width:150px; font-size:11.5px; color:var(--muted); flex-shrink:0; text-align:right;}
.bar-row .bt{flex:1; background:var(--bg); border-radius:6px; height:20px; position:relative; overflow:hidden;}
.bar-row .bf{height:100%; border-radius:6px; background:linear-gradient(90deg,var(--accent),var(--accent2)); display:flex; align-items:center;}
.bar-row .bv{width:120px; font-size:11.5px; font-weight:700; flex-shrink:0;}
.note{font-size:11.5px; color:var(--muted); margin-top:10px; line-height:1.7; background:var(--bg); border:1px dashed var(--border); border-radius:8px; padding:10px 12px;}
footer{color:var(--muted); font-size:11px; padding-top:10px; border-top:1px solid var(--border); margin-top:6px;}
.legend{display:flex; gap:14px; font-size:11.5px; margin-bottom:6px;}
.legend span{display:flex; align-items:center; gap:5px;}
.legend i{width:10px; height:10px; border-radius:2px; display:inline-block;}
.donut-wrap{display:flex; align-items:center; gap:16px; flex-wrap:wrap;}
.donut-legend{font-size:11.5px; flex:1; min-width:150px;}
.donut-legend .row{display:flex; align-items:center; gap:7px; margin-bottom:7px;}
.donut-legend i{width:10px; height:10px; border-radius:3px; flex-shrink:0;}
.rankbadge{display:inline-flex; align-items:center; justify-content:center; width:20px; height:20px; border-radius:50%; background:var(--accent); color:#fff; font-size:10.5px; font-weight:800; margin-right:6px;}
.acct-badge{display:inline-block; font-size:10px; padding:2px 8px; border-radius:10px; margin-left:6px; font-weight:700; background:#e0e7ff; color:#4338ca;}
.top5-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); gap:12px; margin-top:6px;}
.creative-card{border:1px solid var(--border); border-radius:12px; overflow:hidden; background:var(--bg); position:relative;}
.creative-card .rank{position:absolute; top:7px; left:7px; background:var(--accent); color:#fff; font-size:10.5px; font-weight:800; padding:2px 7px; border-radius:20px; z-index:2;}
.creative-card img{width:100%; height:140px; object-fit:cover; display:block; background:#ddd;}
.creative-card .noimg{width:100%; height:140px; display:flex; align-items:center; justify-content:center; color:var(--muted); font-size:11px; background:repeating-linear-gradient(45deg,#eee,#eee 8px,#f6f6f6 8px,#f6f6f6 16px);}
.creative-card .info{padding:8px 10px;}
.creative-card .cname{font-size:10.5px; font-weight:600; line-height:1.4; max-height:3.9em; overflow:hidden;}
.creative-card .cmetric{font-size:10.5px; color:var(--accent); font-weight:700; margin-top:4px;}
.loading{padding:40px; text-align:center; color:var(--muted);}
</style>
</head>
<body>
<aside>
<div class="logo">
<div class="brand">DAYS ON</div>
<div class="period">통합 광고 성과 대시보드<br><span id="dataRangeLabel">불러오는 중...</span></div>
</div>
<nav id="sidenav"></nav>
</aside>
<main>
<div class="topbar">
<div>
<h1 id="pageTitle">표지 · 요약</h1>
<p class="sub">담당 최연아·안희성 | 02-3775-9290 · 02-3775-9277</p>
</div>
<div class="periodbox">
<label>보기</label>
<select id="levelSelect" onchange="onLevelChange()">
<option value="month">월별</option>
<option value="week">주차(변환)별</option>
<option value="day">일별</option>
</select>
<label>월</label>
<select id="monthSelect" onchange="onMonthChange()"></select>
<label id="weekLabelEl" style="display:none">주차</label>
<select id="weekSelect" style="display:none" onchange="onWeekChange()"></select>
<label id="dayLabelEl" style="display:none">일자</label>
<select id="daySelect" style="display:none" onchange="onDayChange()"></select>
</div>
</div>
<div id="app"><div class="loading">데이터를 불러오는 중입니다...</div></div>
</main>

<script>
const NUMFIELDS = ['impr','clicks','cost','purchase','revenue','reach','cart','cart_revenue'];
const CH_NAMES = {
  네이버SA:"네이버 SA", 구글:"구글", 네이버GFA:"네이버 GFA", 애드부스트:"애드부스트",
  메타_협력광고:"META 협력광고", 메타_외부링크:"META 외부링크"
};
const MEDIA_KEYS = ["메타_협력광고","메타_외부링크","구글","네이버SA","네이버GFA","애드부스트"];
const GH_OWNER = "ahnhee7165", GH_REPO = "meta_days-on", GH_BRANCH = "main", UPLOAD_DIR = "raw-uploads";
const MONTH_ORDER = Array.from({length:12},(_,i)=>`${i+1}월`);

let DATA = null, META_EXTRA = null;
let currentLevel = "month";
let currentMonth = null, currentWeek = null, currentDay = null;
let activeTab = "overview";
let UPLOADED_FILES = {};
let UPLOAD_ROWS_ADDED = 0;
let UPLOAD_ERRORS = [];

function fmt(n){ if(n===null||n===undefined) return "-"; if(typeof n==="string") return n; return Math.round(n).toLocaleString('ko-KR'); }
function pct(n){ if(n===null||n===undefined) return "-"; return n+"%"; }

// ---- 업로드된 raw CSV를 위한 날짜 -> 월/주차(변환) 변환 (구글시트와 동일한 "월 경계마다 리셋" 로직) ----
function monthBoundedWeek(dateStr){
  const d = new Date(dateStr+"T00:00:00");
  const monthStart = new Date(d.getFullYear(), d.getMonth(), 1);
  const msWeekday = (monthStart.getDay()+6)%7; // Mon=0..Sun=6
  const daysToFri = (4 - msWeekday + 7) % 7;
  const firstFriday = new Date(monthStart); firstFriday.setDate(monthStart.getDate()+daysToFri);
  let weekNum;
  if(d < firstFriday) weekNum = 1;
  else weekNum = 2 + Math.floor((d - firstFriday)/(7*86400000));
  const month = `${d.getMonth()+1}월`;
  return {month, week_label:`${d.getMonth()+1}월 ${weekNum}주차`};
}

function parseCSVRaw(text){
  const lines = text.split(/\r?\n/).filter(l=>l.trim().length>0);
  if(lines.length<2) return {header:[], rows:[]};
  const splitLine = l => l.split(',').map(s=>s.trim().replace(/^"|"$/g,''));
  const header = splitLine(lines[0]);
  const rows = lines.slice(1).map(splitLine);
  return {header, rows};
}
function col(header, name){ return header.indexOf(name); } // indexOf = 첫 번째로 일치하는 컬럼 (구글의 중복 '일' 컬럼도 이걸로 안전하게 첫 번째 것을 씀)
function num(v){ if(v===undefined||v===null) return 0; const s=String(v).replace(/,/g,'').trim(); if(s===''||s==='-') return 0; const n=parseFloat(s); return isNaN(n)?0:n; }
function normDate(v){
  if(!v) return '';
  v = v.trim();
  if(/^\d{4}-\d{2}-\d{2}/.test(v)) return v.slice(0,10);
  const m = v.match(/^(\d{4})\.(\d{1,2})\.(\d{1,2})\.?$/); // 2026.08.07. 형식
  if(m) return `${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`;
  const d = new Date(v);
  if(!isNaN(d)) return d.toISOString().slice(0,10);
  return '';
}

// 매체별 raw 시트와 동일한 컬럼 구조를 그대로 해석하기 위한 설정
const MEDIA_PARSERS = {
  "네이버SA": {dateCol:"일별", campaignCol:"캠페인", campaignTypeCol:"캠페인유형", imprCol:"노출수", clicksCol:"클릭수", costCol:"총비용", purchaseCol:"구매완료 전환수", revenueCol:"구매완료 전환매출액(원)"},
  "구글": {dateCol:"일", campaignCol:"캠페인", imprCol:"노출수", clicksCol:"클릭수", costCol:"비용", purchaseCol:"전환", revenueCol:"전환 가치"},
  "네이버GFA": {dateCol:"기간", campaignCol:"캠페인 이름", imprCol:"노출수", clicksCol:"클릭수", costCol:"총비용", purchaseCol:"구매완료 수", revenueCol:"구매완료 전환매출액", cartCol:"장바구니 담기 수", cartRevenueCol:"장바구니 전환매출액", segmentCol:"연령 및 성별"},
  "애드부스트": {dateCol:"기간", campaignCol:"상품명", imprCol:"노출수", clicksCol:"클릭수", costCol:"총비용", purchaseCol:"구매완료 수", revenueCol:"구매완료 전환매출액", cartCol:"장바구니 담기 수", cartRevenueCol:"장바구니 전환매출액"},
  "메타_협력광고": {dateCol:"일", campaignCol:"캠페인 이름", imprCol:"노출", clicksCol:"링크 클릭", costCol:"지출 금액 (KRW)", purchaseCol:"공유 항목이 포함된 구매", revenueCol:"공유 항목의 구매 전환값", reachCol:"도달", cartCol:"공유 항목이 포함된 장바구니에 담기", cartRevenueCol:"공유 항목의 장바구니에 담기 전환값", segmentCol:"노출 위치"},
  "메타_외부링크": {dateCol:"일", campaignCol:"캠페인 이름", imprCol:"노출", clicksCol:"링크 클릭", costCol:"지출 금액 (KRW)", purchaseCol:"구매", revenueCol:"구매 전환값", reachCol:"도달", cartCol:"장바구니에 담기", cartRevenueCol:"장바구니에 담기 전환값", segmentCol:"노출 위치"},
};

function parseMediaCSV(media, text){
  const cfg = MEDIA_PARSERS[media];
  if(!cfg) return [];
  const {header, rows} = parseCSVRaw(text);
  const idx = {};
  for(const key in cfg){ idx[key] = col(header, cfg[key]); }
  const out = [];
  for(const r of rows){
    const date = normDate(idx.dateCol>=0 ? r[idx.dateCol] : '');
    if(!date) continue;
    out.push({
      date,
      campaign: idx.campaignCol>=0 ? r[idx.campaignCol] : '',
      campaign_type: idx.campaignTypeCol>=0 ? r[idx.campaignTypeCol] : '',
      segment: idx.segmentCol>=0 ? r[idx.segmentCol] : '',
      impr: idx.imprCol>=0 ? num(r[idx.imprCol]) : 0,
      clicks: idx.clicksCol>=0 ? num(r[idx.clicksCol]) : 0,
      cost: idx.costCol>=0 ? num(r[idx.costCol]) : 0,
      purchase: idx.purchaseCol>=0 ? num(r[idx.purchaseCol]) : 0,
      revenue: idx.revenueCol>=0 ? num(r[idx.revenueCol]) : 0,
      reach: idx.reachCol>=0 ? num(r[idx.reachCol]) : 0,
      cart: idx.cartCol>=0 ? num(r[idx.cartCol]) : 0,
      cart_revenue: idx.cartRevenueCol>=0 ? num(r[idx.cartRevenueCol]) : 0,
    });
  }
  return out;
}

function emptyBucket(){ return {impr:0,clicks:0,cost:0,purchase:0,revenue:0,reach:0,cart:0,cart_revenue:0}; }
function recomputeMetrics(b){
  b.total_conv = +(b.purchase + b.cart).toFixed(1);
  b.total_conv_revenue = +(b.revenue + b.cart_revenue).toFixed(1);
  b.ctr = b.impr? +(b.clicks/b.impr*100).toFixed(2):0;
  b.cpc = b.clicks? +(b.cost/b.clicks).toFixed(1):0;
  b.cpm = b.impr? +(b.cost/b.impr*1000).toFixed(1):0;
  b.cpa = b.purchase? +(b.cost/b.purchase).toFixed(1):0;
  b.roas = b.cost? +(b.revenue/b.cost*100).toFixed(1):0;
  b.aov = b.purchase? +(b.revenue/b.purchase).toFixed(1):0;
  b.cvr = b.clicks? +(b.purchase/b.clicks*100).toFixed(2):0;
}
function addToBucket(bucketObj, key, nums){
  if(!bucketObj[key]) bucketObj[key] = emptyBucket();
  const b = bucketObj[key];
  for(const f in nums){ b[f] = (b[f]||0) + (nums[f]||0); }
  recomputeMetrics(b);
}

function mergeParsedRow(media, row){
  if(!DATA.media[media] || !row.date) return false;
  const {month, week_label} = monthBoundedWeek(row.date);
  const nums = {impr:row.impr, clicks:row.clicks, cost:row.cost, purchase:row.purchase, revenue:row.revenue, reach:row.reach, cart:row.cart, cart_revenue:row.cart_revenue};
  const m = DATA.media[media];
  addToBucket(m.daily, row.date, nums);
  const wkKey = `${month}|${week_label}`;
  addToBucket(m.weekly, wkKey, nums);
  addToBucket(m.monthly, month, nums);
  if(row.campaign){
    addToBucket(m.campaign, row.campaign, nums);
    if(!m.campaign_by_month) m.campaign_by_month = {};
    if(!m.campaign_by_month[month]) m.campaign_by_month[month] = {};
    addToBucket(m.campaign_by_month[month], row.campaign, nums);
    if(!m.campaign_by_week) m.campaign_by_week = {};
    if(!m.campaign_by_week[wkKey]) m.campaign_by_week[wkKey] = {};
    addToBucket(m.campaign_by_week[wkKey], row.campaign, nums);
  }
  if(row.segment){
    if(!m.segment) m.segment = {};
    addToBucket(m.segment, row.segment, nums);
    if(!m.segment_by_month) m.segment_by_month = {};
    if(!m.segment_by_month[month]) m.segment_by_month[month] = {};
    addToBucket(m.segment_by_month[month], row.segment, nums);
    if(!m.segment_by_week) m.segment_by_week = {};
    if(!m.segment_by_week[wkKey]) m.segment_by_week[wkKey] = {};
    addToBucket(m.segment_by_week[wkKey], row.segment, nums);
  }
  if(media==="네이버SA" && row.campaign_type){
    if(!m.campaign_type) m.campaign_type = {};
    addToBucket(m.campaign_type, row.campaign_type, nums);
    if(!m.campaign_type_by_month) m.campaign_type_by_month = {};
    if(!m.campaign_type_by_month[month]) m.campaign_type_by_month[month] = {};
    addToBucket(m.campaign_type_by_month[month], row.campaign_type, nums);
    if(!m.campaign_type_by_week) m.campaign_type_by_week = {};
    if(!m.campaign_type_by_week[wkKey]) m.campaign_type_by_week[wkKey] = {};
    addToBucket(m.campaign_type_by_week[wkKey], row.campaign_type, nums);
  }

  if(!DATA.months.includes(month)) DATA.months.push(month);
  if(!DATA.weeks_by_month[month]) DATA.weeks_by_month[month] = [];
  if(!DATA.weeks_by_month[month].includes(week_label)) DATA.weeks_by_month[month].push(week_label);
  if(!DATA.days_by_week[wkKey]) DATA.days_by_week[wkKey] = [];
  if(!DATA.days_by_week[wkKey].includes(row.date)) DATA.days_by_week[wkKey].push(row.date);
  return true;
}

function resortCalendar(){
  DATA.months.sort((a,b)=>MONTH_ORDER.indexOf(a)-MONTH_ORDER.indexOf(b));
  for(const mo in DATA.weeks_by_month){
    DATA.weeks_by_month[mo].sort((a,b)=>{
      const na = parseInt((a.match(/(\d+)주차/)||[0,99])[1]);
      const nb = parseInt((b.match(/(\d+)주차/)||[0,99])[1]);
      return na-nb;
    });
  }
  for(const k in DATA.days_by_week){ DATA.days_by_week[k].sort(); }
}

async function fetchFolder(path){
  try{
    const res = await fetch(`https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/contents/${path}`);
    if(!res.ok) return [];
    const list = await res.json();
    return Array.isArray(list) ? list.filter(f=>f.type==='file' && f.name.toLowerCase().endsWith('.csv')) : [];
  }catch(e){ return []; }
}

async function loadUploadedReports(){
  UPLOADED_FILES = {}; UPLOAD_ROWS_ADDED = 0; UPLOAD_ERRORS = [];
  for(const media of MEDIA_KEYS){
    const files = await fetchFolder(`${UPLOAD_DIR}/${media}`);
    UPLOADED_FILES[media] = files;
    for(const f of files){
      try{
        const text = await fetch(f.download_url).then(r=>r.text());
        const parsedRows = parseMediaCSV(media, text);
        let added = 0;
        parsedRows.forEach(r=>{ if(mergeParsedRow(media, r)) added++; });
        UPLOAD_ROWS_ADDED += added;
      }catch(e){
        UPLOAD_ERRORS.push(`${media}/${f.name}: 불러오기 실패`);
      }
    }
  }
  resortCalendar();
}

async function boot(){
  const [d, m] = await Promise.all([
    fetch('data.json').then(r=>r.json()),
    fetch('meta_extra.json').then(r=>r.json())
  ]);
  DATA = d; META_EXTRA = m;
  await loadUploadedReports();
  currentMonth = DATA.months[DATA.months.length-1] || DATA.months[0];
  document.getElementById('dataRangeLabel').textContent = `${DATA.months[0]} ~ ${DATA.months[DATA.months.length-1]}`;
  buildMonthSelect();
  render();
}

function buildMonthSelect(){
  const sel = document.getElementById('monthSelect');
  sel.innerHTML = DATA.months.map(m=>`<option value="${m}" ${m===currentMonth?'selected':''}>${m}</option>`).join('');
}
function buildWeekSelect(){
  const weeks = (DATA.weeks_by_month[currentMonth]||[]);
  currentWeek = weeks[0] || null;
  const sel = document.getElementById('weekSelect');
  sel.innerHTML = weeks.map(w=>`<option value="${w}">${w}</option>`).join('');
}
function buildDaySelect(){

function periodLabel(){
  if(currentLevel==='month') return currentMonth;
  if(currentLevel==='week') return currentWeek;
  return currentDay;
}

function getMetrics(mediaKey){
  const m = DATA.media[mediaKey];
  if(!m) return null;
  if(currentLevel==='month') return m.monthly[currentMonth] || null;
  if(currentLevel==='week') return m.weekly[`${currentMonth}|${currentWeek}`] || null;
  return m.daily[currentDay] || null;
}

function getPrevPeriodInfo(){
  if(currentLevel==='month'){
    const idx = DATA.months.indexOf(currentMonth);
    if(idx>0) return {type:'month', key:DATA.months[idx-1]};
    return null;
  }
  if(currentLevel==='week'){
    const weeks = DATA.weeks_by_month[currentMonth]||[];
    const idx = weeks.indexOf(currentWeek);
    if(idx>0) return {type:'week', month:currentMonth, week:weeks[idx-1]};
    return null;
  }
  if(currentLevel==='day'){
    const days = DATA.days_by_week[`${currentMonth}|${currentWeek}`]||[];
    const idx = days.indexOf(currentDay);
    if(idx>0) return {type:'day', day:days[idx-1]};
    return null;
  }
  return null;
}
function getPrevMetrics(mediaKey){
  const info = getPrevPeriodInfo();
  if(!info) return null;
  const m = DATA.media[mediaKey];
  if(!m) return null;
  if(info.type==='month') return m.monthly[info.key]||null;
  if(info.type==='week') return m.weekly[`${info.month}|${info.week}`]||null;
  if(info.type==='day') return m.daily[info.day]||null;
  return null;
}
function prevLabel(){
  if(currentLevel==='month') return '전월 대비';
  if(currentLevel==='week') return '전주 대비';
  return '전일 대비';
}
function deltaPct(cur, prev){
  if(!prev) return null;
  return Math.round((cur-prev)/prev*1000)/10;
}
function deltaBadge(cur, prev){
  const p = deltaPct(cur, prev);
  if(p===null) return `<span class="delta flat">${prevLabel()} 비교 데이터 없음</span>`;
  const cls = p>0?'up':(p<0?'down':'flat');
  const sign = p>0?'+':'';
  return `<span class="delta ${cls}">${prevLabel()} ${sign}${p}%</span>`;
}

function barChart(rows, unit){
  const max = Math.max(...rows.map(r=>r.v||0), 1);
  return `<div class="chart-wrap">${rows.map(r=>`
    <div class="bar-row">
      <div class="bl">${r.label}</div>
      <div class="bt"><div class="bf" style="width:${Math.max((r.v/max*100),2)}%"></div></div>
      <div class="bv">${fmt(r.v)}${unit}</div>
    </div>`).join('')}</div>`;
}

function lineChart(days, dailyMap, w=760, h=220){
  if(!days || days.length===0) return `<p class="desc">일별 데이터가 부족합니다.</p>`;
  const data = days.map(d=>[d, (dailyMap[d]?.cost)||0, (dailyMap[d]?.revenue)||0]);
  const pad = {l:70,r:16,t:14,b:26};
  const iw = w-pad.l-pad.r, ih = h-pad.t-pad.b;
  const maxV = Math.max(...data.map(d=>Math.max(d[1],d[2])), 1);
  const n = data.length;
  const x = i => pad.l + (n<=1?0:(i/(n-1))*iw);
  const y = v => pad.t + ih - (v/maxV*ih);
  const path = (idx) => data.map((d,i)=>`${i===0?'M':'L'}${x(i).toFixed(1)},${y(d[idx]).toFixed(1)}`).join(' ');
  const ticks = [0,0.25,0.5,0.75,1].map(f=>Math.round(maxV*f));
  const gridlines = ticks.map(t=>`<line x1="${pad.l}" x2="${w-pad.r}" y1="${y(t).toFixed(1)}" y2="${y(t).toFixed(1)}" stroke="#eee" stroke-width="1"/><text x="${pad.l-8}" y="${(y(t)+3).toFixed(1)}" font-size="9.5" fill="#9ca3af" text-anchor="end">${fmt(t)}</text>`).join('');
  const step = Math.max(1, Math.floor(n/8));
  const xlabels = data.filter((d,i)=> i%step===0 || i===n-1).map(d=>{
    const i = data.indexOf(d);
    return `<text x="${x(i).toFixed(1)}" y="${h-6}" font-size="9" fill="#9ca3af" text-anchor="middle">${d[0].slice(5)}</text>`;
  }).join('');
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%; height:auto;">
    ${gridlines}
    <path d="${path(1)}" fill="none" stroke="#4f46e5" stroke-width="2"/>
    <path d="${path(2)}" fill="none" stroke="#06b6d4" stroke-width="2"/>
    ${xlabels}
  </svg>
  <div class="legend"><span><i style="background:#4f46e5"></i>광고비</span><span><i style="background:#06b6d4"></i>구매전환매출</span></div>`;
}

function donutChart(items){
  const total = items.reduce((s,i)=>s+i.v,0) || 1;
  const colors = ["#4f46e5","#06b6d4","#f59e0b","#10b981","#ec4899","#8b5cf6"];
  let acc = 0;
  const stops = items.map((it,i)=>{
    const start = acc/total*360; acc += it.v; const end = acc/total*360;
    return `${colors[i%colors.length]} ${start.toFixed(1)}deg ${end.toFixed(1)}deg`;
  }).join(', ');
  const legend = items.map((it,i)=>`<div class="row"><i style="background:${colors[i%colors.length]}"></i>${it.label} · ${(it.v/total*100).toFixed(1)}% (${fmt(it.v)}원)</div>`).join('');
  return `<div class="donut-wrap">
    <div style="width:140px;height:140px;border-radius:50%;background:conic-gradient(${stops}); flex-shrink:0; box-shadow:inset 0 0 0 22px #fff, 0 0 0 1px #eee;"></div>
    <div class="donut-legend">${legend}</div>
  </div>`;
}

    <div class="panel"><h2>${title} <span class="acct-badge">${acct.account_id}</span></h2>
    <p class="desc">Meta Ads MCP 실시간 조회 (전체 기간 누적) · 소재 이미지는 Meta CDN 실시간 링크라 며칠 지나면 만료되어 깨질 수 있어요.</p>
    ${cards(list, metricFn, metricLabel)}
    </div>`;
  return `
  <div class="panel"><h2>${CH_NAMES[key]} · 기기별 성과 <span class="acct-badge">${acct.account_id}</span></h2>${barChart(devRows,"원")}</div>
  <div class="panel"><h2>${CH_NAMES[key]} · 성별 성과 <span class="acct-badge">${acct.account_id}</span></h2>${barChart(genderRows,"원")}</div>
  <div class="panel"><h2>${CH_NAMES[key]} · 지면별 성과 <span class="acct-badge">${acct.account_id}</span></h2>${barChart(placeRows,"원")}</div>
  ${top5block(acct.top5_purchase, `${CH_NAMES[key]} · 소재 성과 TOP5 (구매 기준)`, c=>fmt(c.purchase)+"건", "구매")}
  ${top5block(acct.top5_revenue, `${CH_NAMES[key]} · 소재 성과 TOP5 (구매매출 기준)`, c=>fmt(c.revenue)+"원", "매출")}
  ${top5block(acct.top5_clicks, `${CH_NAMES[key]} · 소재 성과 TOP5 (클릭 기준)`, c=>fmt(c.clicks)+"회", "클릭")}
  `;
}

function top5PageHTML(){
  return `<div class="panel"><h2>소재 성과 TOP5 · 기기/성별/지면 분석</h2>
    <p class="desc">Meta Ads MCP로 실시간 조회한 협력광고·외부링크 두 계정의 소재/타겟 성과를 한 곳에서 볼 수 있어요.</p>
  </div>
  ${metaExtraSection('메타_협력광고')}
  ${metaExtraSection('메타_외부링크')}`;
}

function uploadPageHTML(){
  const totalFiles = MEDIA_KEYS.reduce((s,m)=> s + (UPLOADED_FILES[m]?UPLOADED_FILES[m].length:0), 0);
  const errBlock = UPLOAD_ERRORS.length ? `<div class="note">⚠️ ${UPLOAD_ERRORS.join(' · ')}</div>` : '';

  const mediaBlocks = MEDIA_KEYS.map(media=>{
    const cfg = MEDIA_PARSERS[media];
    const files = UPLOADED_FILES[media] || [];
    const uploadUrl = `https://github.com/${GH_OWNER}/${GH_REPO}/upload/${GH_BRANCH}/${UPLOAD_DIR}/${media}`;
    const cols = ["dateCol","campaignCol","campaignTypeCol","imprCol","clicksCol","costCol","purchaseCol","revenueCol","reachCol","cartCol","cartRevenueCol","segmentCol"]
      .filter(k=>cfg[k]).map(k=>cfg[k]);
    const fileRows = files.map(f=>`<tr>
        <td>${f.name}</td>
        <td class="num">${(f.size/1024).toFixed(1)} KB</td>
        <td class="num"><a href="${f.html_url}" target="_blank" rel="noopener">보기/삭제</a></td>
      </tr>`).join('');
    return `<div class="panel">
      <h2>${CH_NAMES[media]} <span class="acct-badge">${files.length}개 파일</span></h2>
      <p class="desc">구글시트 "${media}" 탭을 그대로 CSV로 내보내서 올리면 돼요. 필요한 컬럼: <b>${cols.join(', ')}</b> (다른 컬럼이 더 있어도 무시하고 알아서 읽어요)</p>
      <a href="${uploadUrl}" target="_blank" rel="noopener" style="display:inline-block; background:var(--accent); color:#fff; padding:8px 16px; border-radius:8px; font-weight:700; font-size:12.5px; text-decoration:none;">+ ${CH_NAMES[media]} raw CSV 업로드</a>
      ${files.length ? `<div class="table-wrap" style="margin-top:12px"><table><thead><tr><th>파일명</th><th>크기</th><th>관리</th></tr></thead><tbody>${fileRows}</tbody></table></div>` : `<p class="desc" style="margin-top:8px">아직 업로드된 파일 없음</p>`}
    </div>`;
  }).join('');

  return `
  <div class="panel">
    <h2>보고서 업로드</h2>
    <p class="desc">매체별로 raw CSV를 깃허브 <code>${UPLOAD_DIR}/&lt;매체&gt;/</code> 폴더에 올리면, 페이지를 열 때마다 자동으로 전부 합쳐서(누적) 대시보드에 반영돼요. 컬럼 구조는 구글시트 각 매체 탭의 원본 export 그대로 쓰면 됩니다 — 날짜는 이 페이지가 알아서 인식해서(YYYY-MM-DD, YYYY.MM.DD. 둘 다 가능) 월/주차(변환)를 자동 계산해요.</p>
    <p class="desc">현재 총 <b>${totalFiles}개</b> 파일에서 <b>${fmt(UPLOAD_ROWS_ADDED)}행</b>이 추가 반영됐어요.</p>
    ${errBlock}
  </div>
  ${mediaBlocks}
  <div class="panel">
    <div class="note">📌 잘못 올린 파일은 각 매체 카드의 "보기/삭제" 링크로 들어가서, 깃허브 파일 화면의 "..." 메뉴 → Delete file → Commit changes 하시면 바로 집계에서 빠져요.</div>
  </div>`;
}

const TABS = [
  {key:"overview", label:"표지 · 요약", group:"메인"},
  {key:"메타_협력광고", label:"META 협력광고", group:"매체별 리포트"},
  {key:"메타_외부링크", label:"META 외부링크", group:"매체별 리포트"},
  {key:"구글", label:"구글", group:"매체별 리포트"},
  {key:"네이버SA", label:"네이버 SA", group:"매체별 리포트"},
  {key:"네이버GFA", label:"네이버 GFA", group:"매체별 리포트"},
  {key:"애드부스트", label:"애드부스트", group:"매체별 리포트"},
  {key:"top5", label:"소재 성과 TOP5", group:"소재 분석"},
  {key:"upload", label:"보고서 업로드", group:"관리"},
];

function render(){
  const nav = document.getElementById('sidenav');
  let html=''; let lastGroup=null;
  TABS.forEach(t=>{ if(t.group!==lastGroup){ html += `<div class="group-label">${t.group}</div>`; lastGroup=t.group; } html += `<button data-key="${t.key}" onclick="showTab('${t.key}')"><span class="dot"></span>${t.label}</button>`; });
  nav.innerHTML = html;
  renderApp();
}

function renderApp(){
  const app = document.getElementById('app');
  let content = `<section class="tab active" id="tab-overview">${overviewHTML()}</section>`;
  TABS.filter(t=>t.key!=="overview" && t.key!=="top5" && t.key!=="upload").forEach(t=>{
    content += `<section class="tab" id="tab-${t.key}">${channelTableHTML(t.key)}</section>`;
  });
  content += `<section class="tab" id="tab-top5">${top5PageHTML()}</section>`;
  content += `<section class="tab" id="tab-upload">${uploadPageHTML()}</section>`;
  content += `<footer>DAYS ON 통합 광고 성과 대시보드 · 데이터 출처: 광고주 제공 원본 raw 시트(메타/네이버/구글/애드부스트) 집계 및 Meta Ads MCP 실시간 조회 · 이 페이지는 정적 데이터(data.json) 기준이며, 최신화하려면 raw 데이터를 갱신한 뒤 data.json을 다시 생성해 커밋하세요.</footer>`;
  app.innerHTML = content;
  showTab(activeTab);
}

function showTab(key){
  activeTab = key;
  document.querySelectorAll('section.tab').forEach(s=>s.classList.remove('active'));
  const el = document.getElementById('tab-'+key);
  if(el) el.classList.add('active');
  document.querySelectorAll('#sidenav button').forEach(b=>b.classList.toggle('active', b.dataset.key===key));
  const t = TABS.find(t=>t.key===key);
  document.getElementById('pageTitle').textContent = t ? t.label : key;
  window.scrollTo({top:0, behavior:'smooth'});
}

boot();
</script>
</body>
</html>
